<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de compras</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="/frontend/public/css/main.css">

  <!-- JS principal (MÓDULOS) -->
  <script type="module">
    import { loadSellercards } from "/frontend/public/js/components/seller_card.js";
    import { initCommentsSidebar } from "/frontend/public/js/components/comments.js";

    document.addEventListener("DOMContentLoaded", () => {
      loadSellercards(".seller-cards__container");
      initCommentsSidebar(); // ✅ esto inyecta el sidebar
    });
  </script>

  <!-- Otros scripts normales -->
  <script src="/frontend/public/js/components/navbar_shopping_cart.js" defer></script>
  <script src="/frontend/public/js/components/footer.js" defer></script>
</head>
<body>

  <section class="section-footer-content">
    
    <!-- Navbar -->
    <nav class="navbar_shopping_cart">
      <div class="navbar-container"></div>
    </nav>

    <!-- ✅ CONTENEDOR NECESARIO PARA EL SIDEBAR -->
    <section class="comments_users">
      <div class="comments-userss-container"></div>
      <div class="comments-overlay"></div>
    </section>

    <!-- ✅ FALTABA ESTE CONTENEDOR -->
    <section class="products-cards">
      <div class="seller-cards__container"></div>
    </section>

  </section>

  <!-- Footer -->
  <footer class="footer-view-car-pay">
    <div class="footer-container"></div>
  </footer>

</body>
</html>
