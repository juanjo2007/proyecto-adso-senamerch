<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos</title>
  
  <link rel="stylesheet" href="/frontend/public/css/main.css">

  <!-- OJO: si usas export/import, debe ser module -->
  <script type="module">
    import { loadCards } from "/frontend/public/js/components/card.js";
    document.addEventListener("DOMContentLoaded", () => { loadCards(".card-container"); });
  </script>

  <script src="/frontend/public/js/components/search-bar.js" defer></script>
  <script src="/frontend/public/js/components/navbar.js" defer></script>
  <script src="/frontend/public/js/components/footer.js" defer></script>
  <script src="/frontend/public/js/components/payment_method.js" defer></script>
    
</head>
<body>
  <!-- >>> Section Navbar -->
  <section class="navabar-products">
    <div class="navbar-container"></div>
  </section>
  <!-- >>> Section Search-bar -->
  <section class="seeker-products">
    <div class="search-bar-container"></div>
  </section>
  <!-- >>> Section cards-->
  <section class="cards-products">
    <div class="card-container"></div>
  </section>
  <!-- >>> Section Section method-payment -->
  <section class="pay">
    <div class="payment-method-container"></div>
  </section>
  <!-- >>> Section Footer -->
  <section class="footer-payment">
    <footer class="footer-container"></footer>
  </section>
  
  
</body>
</html>
