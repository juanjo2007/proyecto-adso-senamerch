<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicaciones</title>

  <!-- CSS Global -->
  <link rel="stylesheet" href="../assets/css/themes/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../assets/css/components/publicaciones.css">
</head>
<body>
  <main class="publicaciones">
    <!-- Título -->
    <h1 class="publicaciones__titulo">Publicaciones</h1>

    <!-- Buscador -->
    <div class="publicaciones__buscador">
      <input type="text" id="searchInput" class="publicaciones__buscador-input" placeholder="Buscar Publicaciones">
      <button class="publicaciones__buscador-btn">
        <span>🔍</span>
      </button>
    </div>
    <p class="publicaciones__buscador-texto">Encontrarás con facilidad lo que buscas.</p>

    <!-- Tabla -->
    <div class="publicaciones__tabla">
      <div class="publicaciones__tabla-header">
        <span>#Publicación</span>
        <span>#Usuario</span>
        <span>#Tienda</span>
        <span>Acción</span>
      </div>

      <div class="publicaciones__tabla-body" id="publicacionesBody">
        <!-- Filas de publicaciones -->
        <div class="publicaciones__tabla-row">
          <span>#1</span><span>#1</span><span>#1</span>
          <button class="publicaciones__btn">Deshabilitar</button>
        </div>
        <div class="publicaciones__tabla-row">
          <span>#2</span><span>#2</span><span>#2</span>
          <button class="publicaciones__btn">Deshabilitar</button>
        </div>
        <div class="publicaciones__tabla-row">
          <span>#3</span><span>#3</span><span>#3</span>
          <button class="publicaciones__btn">Deshabilitar</button>
        </div>
        <div class="publicaciones__tabla-row">
          <span>#4</span><span>#4</span><span>#4</span>
          <button class="publicaciones__btn">Deshabilitar</button>
        </div>
        <div class="publicaciones__tabla-row">
          <span>#5</span><span>#5</span><span>#5</span>
          <button class="publicaciones__btn">Deshabilitar</button>
        </div>
        <div class="publicaciones__tabla-row">
          <span>#6</span><span>#6</span><span>#6</span>
          <button class="publicaciones__btn">Deshabilitar</button>
        </div>
        <div class="publicaciones__tabla-row">
          <span>#7</span><span>#7</span><span>#7</span>
          <button class="publicaciones__btn">Deshabilitar</button>
        </div>
        <div class="publicaciones__tabla-row">
          <span>#8</span><span>#8</span><span>#8</span>
          <button class="publicaciones__btn">Deshabilitar</button>
        </div>
      </div>
    </div>
  </main>

  <!-- JS -->
  <script src="../js/publicaciones.js"></script>
</body>
</html>
