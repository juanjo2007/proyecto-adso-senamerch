<!DOCTYPE html> <!-- Declare document as HTML5 -->
<html lang="en"> <!-- Main language is English -->
<head>
  <meta charset="UTF-8"> <!-- Supports special characters -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive scaling -->
  <title>Posts</title> <!-- Browser tab title -->

  <!-- ====== STYLESHEETS ====== -->
  <!-- Global variables (colors, fonts, etc.) -->
  <link rel="stylesheet" href="../assets/css/themes/variables.css">
  <!-- Base styles -->
  <link rel="stylesheet" href="../css/main.css">
  <!-- Specific styles for posts page -->
  <link rel="stylesheet" href="../assets/css/components/posts.css">
</head>
<body>
  
  <!-- ====== MAIN CONTAINER ====== -->
  <main class="posts"> <!-- Main block for posts -->
    
    <!-- Page title -->
    <h1 class="posts__title">Posts</h1>

    <!-- ====== SEARCH BAR ====== -->
    <div class="posts__search"> <!-- Search container -->
      <input 
        type="text" 
        id="searchInput" 
        class="posts__search-input" 
        placeholder="Search Posts"> <!-- Search field -->
      <button class="posts__search-btn"> <!-- Search button -->
        <span>🔍</span> <!-- Icon inside button -->
      </button>
    </div>
    <!-- Helper text under search bar -->
    <p class="posts__search-text">Find easily what you’re looking for.</p>

    <!-- ====== POSTS TABLE (using divs instead of <table>) ====== -->
    <div class="posts__table"> <!-- Table container -->

      <!-- Table header -->
      <div class="posts__table-header">
        <span>#Post</span>
        <span>#User</span>
        <span>#Store</span>
        <span>Action</span>
      </div>

      <!-- Dynamic table body -->
      <div class="posts__table-body" id="postsBody">
        
        <!-- Row 1 -->
        <div class="posts__table-row">
          <span>#1</span><span>#1</span><span>#1</span>
          <button class="posts__btn">Disable</button> <!-- Action button -->
        </div>

        <!-- Row 2 -->
        <div class="posts__table-row">
          <span>#2</span><span>#2</span><span>#2</span>
          <button class="posts__btn">Disable</button>
        </div>

        <!-- Row 3 -->
        <div class="posts__table-row">
          <span>#3</span><span>#3</span><span>#3</span>
          <button class="posts__btn">Disable</button>
        </div>

        <!-- Row 4 -->
        <div class="posts__table-row">
          <span>#4</span><span>#4</span><span>#4</span>
          <button class="posts__btn">Disable</button>
        </div>

        <!-- Row 5 -->
        <div class="posts__table-row">
          <span>#5</span><span>#5</span><span>#5</span>
          <button class="posts__btn">Disable</button>
        </div>

        <!-- Row 6 -->
        <div class="posts__table-row">
          <span>#6</span><span>#6</span><span>#6</span>
          <button class="posts__btn">Disable</button>
        </div>

        <!-- Row 7 -->
        <div class="posts__table-row">
          <span>#7</span><span>#7</span><span>#7</span>
          <button class="posts__btn">Disable</button>
        </div>

        <!-- Row 8 -->
        <div class="posts__table-row">
          <span>#8</span><span>#8</span><span>#8</span>
          <button class="posts__btn">Disable</button>
        </div>
      </div> <!-- End table body -->
    </div> <!-- End table -->
  </main>

  <!-- ====== PAGE SCRIPT ====== -->
  <script src="../js/posts.js"></script> <!-- JS for interactions -->
</body>
</html>
