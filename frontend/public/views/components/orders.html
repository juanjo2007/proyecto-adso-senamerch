<section class="order-card">
  <!-- Encabezado del pedido -->
  <header class="order-card__header">
    <h2 class="order-card__title">Pedido #12345</h2>
    <span class="order-card__status order-card__status--delivered">Entregado</span>
  </header>

  <!-- Info del pedido -->
  <div class="order-card__info">
    <p class="order-card__date"><strong>Fecha:</strong> 20/09/2025</p>
    <p class="order-card__store"><strong>Tienda:</strong> Frutas El Valle</p>
    <p class="order-card__seller"><strong>Vendedor:</strong> Juan Pérez</p>
    <p class="order-card__shipping"><strong>Envío:</strong> Servientrega - Estándar</p>
  </div>

  <!-- Lista de productos -->
  <ul class="order-card__products">
    <li class="order-card__product">
      <img src="/frontend/public/assets/img/tomato_image.png" alt="Tomate fresco" class="order-card__product-image">
      <div class="order-card__product-details">
        <h3 class="order-card__product-name">Tomate Del Valle</h3>
        <p class="order-card__product-price">$3.000 Kilo</p>
        <p class="order-card__product-quantity">Cantidad: 2</p>
      </div>
    </li>

    <li class="order-card__product">
      <img src="/frontend/public/assets/img/potato__image.jpg" alt="Manzanas rojas" class="order-card__product-image">
      <div class="order-card__product-details">
        <h3 class="order-card__product-name">Papa Roja</h3>
        <p class="order-card__product-price">$5.000 Kilo</p>
        <p class="order-card__product-quantity">Cantidad: 1</p>
      </div>
    </li>
  </ul>

  <!-- Resumen -->
  <div class="order-card__summary">
    <p class="order-card__total">Total: <strong>$11.000</strong></p>

    <!-- Acciones -->
    <div class="order-card__actions">
      <button class="btn--variant2 btn--variant2--secondary">Continuar comprando</button>
      <button class="btn btn--primary">Ver detalles del pedido</button>
    </div>
  </div>
</section>
