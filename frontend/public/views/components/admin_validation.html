<section class="admin-panel">
  <div class="admin-panel__container">
    <div class="admin-panel__content">
      <h1 class="admin-panel__title">Validación de Código</h1>
      <p class="admin-panel__text">Introduce el código secreto de administrador para continuar.</p>

      <form class="admin-panel__form">
        <input type="password" class="admin-panel__input" placeholder="Ingresa el código" required>
        <button type="submit" class="admin-panel__btn">Validar código</button>
      </form>

      <p class="admin-panel__message admin-panel__message--hidden"></p>
    </div>
  </div>
</section>
