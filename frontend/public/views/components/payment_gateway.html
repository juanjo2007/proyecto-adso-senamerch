<main class="payment-gateway">

  <section class="payment-gateway__navbar">

        <thead class="table__head">

            <th class="table__cell">#Documento de venta</th>
            <th class="table__cell">#Usuario</th>
            <th class="table__cell">#Tienda</th>
            <th class="table__cell">Acción</th>
          </tr>
        </thead>
        <tbody class="table__body">
          <tr class="table__row">
            <td class="table__cell">#1</td>
            <td class="table__cell">#1</td>
            <td class="table__cell">#1</td>
            <td class="table__cell">#1</td>
            <td class="table__cell"><button class="btn btn--black">Deshabilitar</button></td>
          </tr>
          <tr class="table__row">
            <td class="table__cell table__cell--disabled">#2</td>
            <td class="table__cell table__cell--disabled">#2</td>
            <td class="table__cell table__cell--disabled">#2</td>
            <td class="table__cell table__cell--disabled">#2</td>
            <td class="table__cell"><button class="btn btn--black">Deshabilitar</button></td>
          </tr>
          <tr class="table__row">
            <td class="table__cell">#3</td>
            <td class="table__cell">#3</td>
            <td class="table__cell">#3</td>
            <td class="table__cell">#3</td>
            <td class="table__cell"><button class="btn btn--black">Deshabilitar</button></td>
          </tr>
          <tr class="table__row">
            <td class="table__cell table__cell--disabled">#4</td>
            <td class="table__cell table__cell--disabled">#4</td>
            <td class="table__cell table__cell--disabled">#4</td>
            <td class="table__cell table__cell--disabled">#4</td>
            <td class="table__cell"><button class="btn btn--black">Deshabilitar</button></td>
          </tr>
        </tbody>
      </table>
    </div>

   
</main>
