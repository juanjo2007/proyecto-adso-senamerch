<section class="register">
  <div class="register__wrapper">
    <header class="register__header">
      <h1 class="register__title">Completa los datos para crear tu cuenta</h1>
      <p class="register__subtitle">
        Este formulario es para registrar<br> tu tienda en <strong>SENA MERCH</strong>.
        Con tu perfil podrás publicar productos y gestionar tus ventas fácilmente.
      </p>
    </header>

    <form class="register__form">
      <div class="register__group">
        <label class="register__label">Correo electrónico</label>
        <input class="register__input" type="email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="register__group">
        <label class="register__label">Nombre</label>
        <input class="register__input" type="text" placeholder="Tu nombre" required>
      </div>

      <div class="register__group">
        <label class="register__label">Tipo de usuario</label>
        <select name="user-type" class="register__input" required>
          <option value="">Selecciona...</option>
          <option value="client">Cliente</option>
          <option value="seller">Vendedor</option>
          <option value="admin">Administrador</option>
        </select>
      </div>


      <div class="register__group">
        <label class="register__label">Departamento</label>
        <select class="register__input" required>
          <option value="">Selecciona...</option>
          <option value="Risaralda">Risaralda</option>
          <option value="Quindío">Quindío</option>
          <option value="Caldas">Caldas</option>
        </select>
      </div>

      <div class="register__group">
        <label class="register__label">Dirección</label>
        <a href="/frontend/public/views/add_adress.html" class="register__link">Agregar dirección</a>
        <small class="register__text">Todo estará más cerca de ti.</small>
      </div>

      <div class="register__group">
        <label class="register__label">Confirma tu contraseña</label>
        <div class="register__password-wrapper">
          <input 
            class="register__input register__input--password"
            type="password"
            name="password"
            autocomplete="new-password"
            required
          >
          <button type="button" class="register__toggle-password">Mostrar</button>
        </div>
      </div>


      <div class="register__buttons">
        <button type="submit" class="btn btn--primary register__button-register">
          Registrar
          <img src="/frontend/public/assets/icons/contact.svg" alt="" class="btn__icon">
        </button>
      </div>
    </form>
  </div>
</section>
