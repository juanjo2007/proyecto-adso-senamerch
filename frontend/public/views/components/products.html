<!-- ================== Componente Productos ================== -->
<main class="products">
  <!-- 1️ Título -->
  <h1 class="products__title">Productos</h1>

  <!-- 2️ Envoltura de la tabla -->
  <div class="products__table-wrapper">

    <!-- 3️ Tabla -->
    <table class="products__table">

      <!-- 4️ Cabecera de la tabla -->
      <thead class="products__table-head">
        <tr class="products__table-row">
          <th class="products__table-header">#Producto</th>
          <th class="products__table-header">Stock</th>
          <th class="products__table-header">#Usuario</th>
          <th class="products__table-header">Tienda</th>
          <th class="products__table-header">Acción</th>
        </tr>
      </thead>

      <!-- 5️ Cuerpo de la tabla -->
      <tbody class="products__table-body">

        <!-- 6️ Fila 1 -->
        <tr class="products__table-row">
          <td class="products__table-cell">#1</td>
          <td class="products__table-cell">Común</td>
          <td class="products__table-cell">#1</td>
          <td class="products__table-cell">#1</td>
          <td class="products__table-cell">
            <button class="products__btn">Deshabilitar</button>
          </td>
        </tr>

        <!-- 7️ Fila 2 -->
        <tr class="products__table-row">
          <td class="products__table-cell">#2</td>
          <td class="products__table-cell">Común</td>
          <td class="products__table-cell">#2</td>
          <td class="products__table-cell">#2</td>
          <td class="products__table-cell">
            <button class="products__btn">Deshabilitar</button>
          </td>
        </tr>

        <!-- 8️ Fila 3 -->
        <tr class="products__table-row">
          <td class="products__table-cell">#3</td>
          <td class="products__table-cell">Común</td>
          <td class="products__table-cell">#3</td>
          <td class="products__table-cell">#3</td>
          <td class="products__table-cell">
            <button class="products__btn">Deshabilitar</button>
          </td>
        </tr>

        <!-- 9️ Fila 4 -->
        <tr class="products__table-row">
          <td class="products__table-cell">#4</td>
          <td class="products__table-cell">Transportador</td>
          <td class="products__table-cell">#4</td>
          <td class="products__table-cell">#4</td>
          <td class="products__table-cell">
            <button class="products__btn">Deshabilitar</button>
          </td>
        </tr>

      </tbody>
    </table>
  </div>
</main>
