<section class="create-post">
  <div class="create-post__wrapper">

    <!-- HEADER -->
    <header class="create-post__header">
      <h1 class="create-post__title">Termina de crear el producto</h1>
      <p class="create-post__subtitle">
        Completa la información necesaria para continuar
        con el registro de tu producto en <strong>SENA MERCH</strong>.
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="create-post__form">
      

      <!-- Campo: Texto -->
      <div class="create-post__group">
        <label class="create-post__label">Descripción producto</label>
        <textarea 
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>
      <!-- NUEVO: Envío contraentrega -->
      <div class="create-post__group">
        <label class="create-post__label">Tipo de envío</label>
        <select class="create-post__input" required>
          <option value="" selected disabled>Selecciona una opción</option>
          <option value="si">Sí, solo envío contraentrega</option>
        </select>
      </div>

      <div class="create-post__group ">
        <label class="create-post__label">Primera imagen del producto</label>
        <input type="file" class="create-post__input" accept="image/*">
      </div>

      <div class="create-post__group ">
        <label class="create-post__label">Segunda imagen del producto</label>
        <input type="file" class="create-post__input" accept="image/*">
      </div>
      
      

      <!-- Botón secundario -->
      <div class="create-post__secondary">
        <button
          type="button"
          class="btn-secundary btn-secundary-style create-post__cancel"
          aria-label="Cancelar edición"
        >
          Volver
          <img
            src="/frontend/public/assets/icons/return.svg" alt="" class="btn-secundary__icon" aria-hidden="true"/>
        </button>
      </div>

      <!-- Botón principal -->
      <div class="create-post__buttons">
        <button
          type="submit"
          class="btn btn--primary create-post__continue"
          aria-label="Guardar datos del administrador"
        >
          Crear producto
          <img src="/frontend/public/assets/icons/create_product.svg" alt="" class="btn__icon" aria-hidden="true"/>
        </button>
      </div>

    </form>

  </div>
</section>
