<section class="create-post">
  <div class="create-post__wrapper">

    <!-- HEADER -->
    <header class="create-post__header">
      <h1 class="create-post__title">Continúa agregando la información del producto</h1>
      <p class="create-post__subtitle">
        Este formulario es para registrar tu producto.  
        Podrás publicarlo y gestionarlo fácilmente.
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="create-post__form">

      <!-- Campo: Condiciones de almacenamiento -->
      <div class="create-post__group">
        <label class="create-post__label">Condiciones de almacenamiento</label>
        <textarea 
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>

      <!-- Campo: Usos en cocina -->
      <div class="create-post__group">
        <label class="create-post__label">Usos en cocina</label>
        <textarea 
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>

      <!-- Campo: Control de calidad -->
      <div class="create-post__group">
        <label class="create-post__label">Control de calidad</label>
        <textarea 
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>

      <!-- Campo: Precio variable -->
      <div class="create-post__group">
        <label class="create-post__label">Precio variable</label>
        <textarea 
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>

      <!-- Botón secundario -->
      <div class="create-post__secondary">
        <button
          type="button"
          class="btn-secundary btn-secundary-style create-post__cancel"
          aria-label="Cancelar edición"
        >
          Cancelar
          <img
            src="/frontend/public/assets/icons/cancel.svg"
            alt=""
            class="btn-secundary__icon"
            aria-hidden="true"
          />
        </button>
      </div>

      <!-- Botón principal -->
      <div class="create-post__buttons">
        <button
          type="submit"
          class="btn btn--primary create-post__continue"
          aria-label="Guardar datos del administrador"
        >
          Siguiente
          <img
            src="/frontend/public/assets/icons/continue.svg"
            alt=""
            class="btn__icon"
            aria-hidden="true"
          />
        </button>
      </div>

    </form>
  </div>
</section>
