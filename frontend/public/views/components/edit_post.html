<section class="edit-post-one">
  <form class="edit-post-one__form">
    <div class="edit-post-one__fields-wrapper">
      <h2 class="edit-post-one__title">Editar producto</h2>

      <!-- Campo: Título -->
      <div class="edit-post-one__field">
        <label class="edit-post-one__label">Título del producto</label>
        <input 
          type="text" 
          class="edit-post-one__input edit-post-one__input--text" 
          value="Tomate del Valle" 
          required
        >
      </div>

      <!-- Campo: Precio -->
      <div class="edit-post-one__field">
        <label class="edit-post-one__label">Precio</label>
        <input 
          type="number" 
          class="edit-post-one__input edit-post-one__input--text" 
          value="3000" 
          min="0" 
          required
        >
      </div>

      <!-- Campo: Categoría -->
      <div class="edit-post-one__field">
        <label class="edit-post-one__label">Categoría</label>
        <select class="edit-post-one__select" required>
          <option value="" disabled>Selecciona una categoría</option>
          <option value="frutas" selected>Frutas</option>
          <option value="verduras">Verduras</option>
          <option value="granos">Granos</option>
          <option value="carnes">Carnes</option>
          <option value="bebidas">Bebidas</option>
          <option value="otros">Otros</option>
        </select>
      </div>

      <!-- Campo: Cantidad disponible -->
      <div class="edit-post-one__field">
        <label class="edit-post-one__label">Stock disponible</label>
        <input 
          type="number" 
          class="edit-post-one__input" 
          value="50" 
          min="1" 
          required
        >
      </div>

      <div class="edit-post-one__field-secundary">
        <button class="btn-secundary btn-secundary-style edit-post-one__cancel">
          Editar
          <img src="/frontend/public/assets/icons/edit.svg" alt="Icono exportar PDF" class="btn-secundary__icon">
        </button>
      </div>

      <div class="edit-post-one__field-primary">
        <button type="button" class="btn btn--primary edit-post-one__save">
          Siguiente
          <img src="/frontend/public/assets/icons/continue.svg" alt="Icono Comprar" class="btn__icon"/>
        </button>
      </div>
    </div>
  </form>
</section>
