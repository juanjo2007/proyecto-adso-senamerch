<section class="edit-post-one">
  <div class="edit-post-one__wrapper">

    <!-- HEADER -->
    <header class="edit-post-one__header">
      <h1 class="edit-post-one__title">Editar producto</h1>
      <p class="edit-post-one__subtitle">
        Este formulario es para registrar<br> tu tienda en <strong>SENA MERCH</strong>.
        Con tu perfil podrás publicar productos y gestionar tus ventas fácilmente.
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="edit-post-one__form">

      <!-- Campo: Título -->
      <div class="edit-post-one__group">
        <label class="edit-post-one__label">Título del producto</label>
        <input 
          type="text"
          class="edit-post-one__input"
          placeholder="Ejemplo: Tomate del Valle"
          required
        >
      </div>

      <!-- Campo: Precio -->
      <div class="edit-post-one__group">
        <label class="edit-post-one__label">Precio</label>
        <input 
          type="number"
          class="edit-post-one__input"
          placeholder="3000"
          min="0"
          required
        >
      </div>

      <!-- Campo: Categoría -->
      <div class="edit-post-one__group">
        <label class="edit-post-one__label">Categoría</label>
        <select class="edit-post-one__input" required>
          <option value="" disabled selected>Selecciona una categoría</option>
          <option value="frutas">Frutas</option>
          <option value="verduras">Verduras</option>
          <option value="granos">Granos</option>
          <option value="carnes">Carnes</option>
          <option value="bebidas">Bebidas</option>
          <option value="otros">Otros</option>
        </select>
      </div>

      <!-- Campo: Stock -->
      <div class="edit-post-one__group">
        <label class="edit-post-one__label">Stock disponible</label>
        <input 
          type="number"
          class="edit-post-one__input"
          placeholder="50"
          min="1"
          required
        >
      </div>

      <!-- Botón secundario -->
      <div class="edit-post-one__secondary">
        <button type="button" class="btn-secundary btn-secundary-style edit-post-one__cancel">
          Cancelar
          <img src="/frontend/public/assets/icons/cancel.svg" alt="" class="btn-secundary__icon">
        </button>
      </div>

      <!-- Botones -->
      <div class="edit-post-one__buttons">
        <button type="button" class="btn btn--primary edit-post-one__save">
          Siguiente
          <img src="/frontend/public/assets/icons/continue.svg" alt="" class="btn__icon"/>
        </button>
      </div>
    </form>
  </div>
</section>
