<section class="payment-method">
  <div class="payment-method__container">
    <h2 class="payment-method__title">Método de pago</h2>

    <div class="payment-method__options">
      <button class="payment-method__option">
        Efectivo 
        <img src="/frontend/public/assets/icons/cash.svg" 
             alt="Efectivo" 
             class="payment-method__icon">
      </button>

      <button class="payment-method__option">
        Nequi 
        <img src="/frontend/public/assets/icons/nequi.svg" 
             alt="Nequi" 
             class="payment-method__icon">
      </button>

      <button class="payment-method__option">
        Tarjeta de débito 
        <img src="/frontend/public/assets/icons/card.svg" 
             alt="Tarjeta de débito" 
             class="payment-method__icon">
      </button>

      <button class="payment-method__option">
        Transferencia 
        <img src="/frontend/public/assets/icons/transfer.svg" 
             alt="Transferencia" 
             class="payment-method__icon">
      </button>
    </div>

    <div class="payment-method__actions">
      <!-- Botón primario -->
      <a href="details.html" class="btn btn--primary">Pagar</a>
    </div>
  </div>
</section>
