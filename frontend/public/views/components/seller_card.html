<article class="product-card">

  <!-- Menú tres puntos -->
  <div class="product-card__actions">
    <!-- Menú tres puntos -->
    <div class="product-card__menu">
      <button class="product-card__menu-btn">⋮</button>

      <ul class="product-card__menu-dropdown">
        <li>
          <a href="#" class="product-card__menu-item" data-action="open-comments">
            Dejar un comentario
            <img 
              src="/frontend/public/assets/icons/contact.svg" 
              alt="Icono me gusta"
              class="product-card__menu-item-icon"
             />
          </a>
        </li>
      </ul>
    </div>

  </div>
  <!-- Header: nombre y precio -->
  <div class="product-card__header">
    <h2 class="product-card__title">{{name}}</h2>
    <p class="product-card__price">$ {{price}} / kilo</p>
    <p class="product-card__discount">{{discount}} % de descuento</p>
  </div>

  <!-- Foto redonda de la tienda -->
  <a href="profile_store_seller.html" class="product-card__profile-store-link">
    <img 
        src="{{store_logo}}"
        alt="Logo de la tienda {{store_name}}"
        class="product-card__store-logo"
    />
    <span class="product-card__profile-store-tooltip">Perfil Tienda
    <img 
        src="/frontend/public/assets/icons/store_profile.svg" 
        alt="Icono me gusta"
        class="product-card__profile-store-tooltip-icon"
        />
    </span>
  </a>
  <!-- Imagen grande del producto (ahora con link y tooltip) -->
  <a href="view_description_product_seller.html" class="product-card__image-link">
    <div class="product-card__image-wrapper">
      <img 
        src="{{image}}"
        alt="Imagen de {{name}}"
        class="product-card__image"
      />
    </div>

    <!-- Tooltip -->
    <span class="product-card__image-tooltip">
      Visualizar Producto
      <img 
        src="/frontend/public/assets/icons/eye.svg"
        alt="Icono visualizar"
        class="product-card__image-tooltip-icon"
      />
    </span>
  </a>
  <!-- Botones -->
  <div class="product-card__footer--seller-edit">
    <button class="btn-secundary btn-secundary-style product-card__footer--seller-edit">
      Editar
      <img src="/frontend/public/assets/icons/edit.svg" alt="Icono gestionar" class="btn-secundary__icon">
    </button>
  </div>

</article>
