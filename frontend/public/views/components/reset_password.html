<div class="main-site">
    <main class="reset">
        <h2 class="reset__title">Restablecer Contraseña</h2>

        <form class="reset__form">

            <div class="reset__field">
                <label class="reset__label">Nueva contraseña</label>
                <input class="reset__input" type="password" placeholder="Nueva contraseña" required>
            </div>

            <div class="reset__field">
                <label class="reset__label">Confirmar contraseña</label>
                <input class="reset__input" type="password" placeholder="Confirma tu contraseña" required>
            </div>
            <div class="reset__button">
                <a href="login.html" class="btn btn--primary reset__save">
                Restablecerla
                <img src="/frontend/public/assets/icons/reset.svg" alt="Icono continuar" class="reset__icon">
                </a>
            </div>  
        </form>

        <a class="reset__link" href="login.html">Volver al inicio de sesión</a>
    </main>
</div>
