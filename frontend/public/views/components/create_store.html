<section class="create-store-one">
  <div class="create-store-one__wrapper">
    <header class="create-store-one__header">
      <h1 class="create-store-one__title">Crear Tienda</h1>
      <p class="create-store-one__subtitle">
        Este formulario es para registrar tu tienda en <strong>SENA MERCH</strong>.
        Con tu perfil podrás publicar productos y gestionar tus ventas fácilmente.
      </p>
    </header>

    <form class="create-store-one__form">
      <div class="create-store-one__group">
        <label class="create-store-one__label">Nombre de la tienda</label>
        <input type="text" class="create-store-one__input" placeholder="Ejemplo: Frutas La Esperanza" required>
      </div>

      <div class="create-store-one__group">
        <label class="create-store-one__label">Correo electrónico</label>
        <input type="email" class="create-store-one__input" placeholder="correo@tienda.com" required>
      </div>

      <div class="create-store-one__group">
        <label class="create-store-one__label">Teléfono</label>
        <input type="tel" class="create-store-one__input" placeholder="+57 300 000 0000" required>
      </div>

      <div class="create-store-one__group">
        <label class="create-store-one__label">Categoría</label>
        <select class="create-store-one__input" required>
          <option value="">Selecciona una categoría</option>
          <option value="Frutas">Frutas</option>
          <option value="Verduras">Verduras</option>
          <option value="Lácteos">Lácteos</option>
          <option value="Lácteos">Granos</option>
          <option value="Todas">Todas</option>
        </select>
      </div>

      <div class="create-store-one__secondary">
        <a href="profile_store_seller.html" class="btn btn-variant2--secondary">Cancelar</a>
      </div>

      <div class="create-store-one__buttons">
        <a href="/frontend/public/views/create_store2.html" class="btn btn--primary">Siguiente</a>
      </div>
    </form>
  </div>
</section>
