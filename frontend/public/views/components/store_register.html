<div class="form-content">
  <h2 class="form-container__title">Registra tu tienda</h2>

  <!-- Campo Nombre -->
  <label class="form-container__field">
    <input type="text" class="form-container__input" placeholder="Nombre de la tienda">
    <small class="form-container__helper">Los demás podrán buscarte</small>
  </label>

  <!-- Campo Número de registro -->
  <label class="form-container__field">
    <input type="text" class="form-container__input" placeholder="Número de registro">
    <small class="form-container__helper">Demuestra que tu empresa está legalmente constituida</small>
  </label>

  <!-- Campo Actividad económica -->
  <label class="form-container__field">
    <input type="text" class="form-container__input" placeholder="Actividad económica">
    <small class="form-container__helper">Producción, distribución y venta</small>
  </label>

  <!-- Campo Departamento -->
  <label class="form-container__field">
    <input type="text" class="form-container__input" placeholder="Departamento">
    <small class="form-container__helper">Así podrás interactuar con locales</small>
  </label>

  <!-- Dirección con botón -->
  <div class="form-container__field form-container__field--inline">
    <input type="text" class="form-container__input" placeholder="Dirección">
    <button class="form-container__button form-container__button--small">Agregar</button>
  </div>
  <small class="form-container__helper">Los clientes estarán más cerca de ti</small>

  <!-- Botón Guardar -->
  <button class="form-container__button form-container__button--submit">Guardar tienda</button>
</div>
