<!-- Contenedor de contenido (reserva espacio debajo del header) -->
<main class="page-content">
  <!-- tu sección product-purchase -->
  <section class="product-purchase">
    <h2 class="product-purchase__title">Selecciona las opciones de compra</h2>
    <!-- ... resto del formulario ... -->
    <div class="product-purchase__group">
      <label class="product-purchase__label">Tipo de producto:</label>
      <div class="product-purchase__options">
        <label class="product-purchase__option">
          <input type="radio" name="productType" value="solid" class="product-purchase__radio" checked> Sólido
        </label>
        <label class="product-purchase__option">
          <input type="radio" name="productType" value="liquid" class="product-purchase__radio"> Líquido
        </label>
      </div>
    </div>

    <div class="product-purchase__group">
      <label class="product-purchase__label">Unidad de medida:</label>
      <select class="product-purchase__select">
        <optgroup label="Sólido">
          <option value="kg">Kilogramo (kg)</option>
          <option value="g">Libra (Lib)</option>
        </optgroup>
        <optgroup label="Líquido">
          <option value="l">Litro (L)</option>
          <option value="ml">Mililitro (mL)</option>
        </optgroup>
      </select>
    </div>

    <div class="product-purchase__group">
      <label class="product-purchase__label">Cantidad (en <span class="product-purchase__unit">kilogramos</span>):</label>
      <input type="number" min="1" class="product-purchase__input" placeholder="Ejemplo: 2">
    </div>

    <div class="product-purchase__actions">
      <a href="/frontend/public/views/viwe_car.html" class="btn btn--primary product-purchase__add">Agregar al carrito
        <img src="/frontend/public/assets/icons/shopping-cart-dollar.svg" alt="Icono Comprar" class="product-purchase__icon">
      </a>
    </div>
  </section>
</main>
