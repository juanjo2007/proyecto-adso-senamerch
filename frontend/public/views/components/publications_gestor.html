<section class="create-post-one">
  <form class="create-post-one__form">
    <div class="create-post-one__fields-wrapper">
      <h2 class="create-post-one__title">Crear Producto</h2>

      <!-- Campo: Título -->
      <div class="create-post-one__field">
        <label class="create-post-one__label">Título del producto</label>
        <input 
          type="text" 
          class="create-post-one__input create-post-one__input--text" 
          placeholder="Ej: Tomate del Valle" 
          required
        >
      </div>

      <!-- Campo: Precio -->
      <div class="create-post-one__field">
        <label class="create-post-one__label">Precio</label>
        <input 
          type="number" 
          class="create-post-one__input create-post-one__input--text" 
          placeholder="Ej: 3000" 
          min="0" 
          required
        >
      </div>

      <!-- Campo: Categoría -->
      <div class="create-post-one__field">
        <label class="create-post-one__label">Categoría</label>
        <select class="create-post-one__select" required>
          <option value="" selected disabled>Selecciona una categoría</option>
          <option value="frutas">Frutas</option>
          <option value="verduras">Verduras</option>
          <option value="carnes">Carnes</option>
          <option value="bebidas">Bebidas</option>
          <option value="otros">Otros</option>
        </select>
      </div>

      <!-- Campo: Cantidad disponible -->
      <div class="create-post-one__field">
        <label class="create-post-one__label">Precio * Unidad de medida</label>
        <select class="create-post-one__select" required>
          <option value="" selected disabled>Selecciona una Unidad</option>
          <option value="kg">Kilogramos (kg)</option>
          <option value="lb">Libras (lb)</option>
          <option value="unidad">Unidad</option>
          <option value="litro">Litros (L)</option>
          <option value="mililitro">Mililitros (mL)</option>
        </select>
      </div>

    <div class="create-post-one__field-secundary">
      <a href="profile_store_seller.html" class="btn btn-variant2--secondary create-post-one__cancel">Cancelar producto
        <img src="/frontend/public/assets/icons/cancel.svg" alt="Icono Comprar" class="create-post-one__icon-secundary">
      </a>
    </div>

    <div class="create-post-one__field-actions">
      <a href="view_publications_gestor2.html" class="btn btn--primary create-post-one__continue">Siguiente
        <img src="/frontend/public/assets/icons/continue.svg" alt="Icono Comprar" class="create-post-one__icon">
      </a>
    </div>
    </div>
  </form>
</section>
