<section class="create-post">
  <form class="create-post__form">
    <div class="create-post__fields-wrapper">
      <h2 class="create-post__title">Crear publicación</h2>

      <!-- Campo: Título -->
      <div class="create-post__field">
        <label class="create-post__label">Título del producto</label>
        <input 
          type="text" 
          class="create-post__input create-post__input--text" 
          placeholder="Ej: Tomate del Valle" 
          required
        >
      </div>

      <!-- Campo: Precio -->
      <div class="create-post__field">
        <label class="create-post__label">Precio</label>
        <input 
          type="number" 
          class="create-post__input create-post__input--text" 
          placeholder="Ej: 3000" 
          min="0" 
          required
        >
      </div>

      <!-- Campo: Categoría -->
      <div class="create-post__field">
        <label class="create-post__label">Categoría</label>
        <select class="create-post__select" required>
          <option value="" selected disabled>Selecciona una categoría</option>
          <option value="frutas">Frutas</option>
          <option value="verduras">Verduras</option>
          <option value="carnes">Carnes</option>
          <option value="bebidas">Bebidas</option>
          <option value="otros">Otros</option>
        </select>
      </div>

      <!-- Campo: Cantidad disponible -->
      <div class="create-post__field">
        <label class="create-post__label">Cantidad disponible</label>
        <input 
          type="number" 
          class="create-post__input" 
          placeholder="Ej: 50" 
          min="1" 
          required
        >
      </div>

    <div class="create-post__field-secundary">
      <a href="seller_view.html" class="btn btn-variant2--secondary">Cancelar</a>
    </div>

    <div class="create-post__field-actions">
      <a href="view_publications_gestor2.html" class="btn btn--primary">Siguente</a>
    </div>
    </div>
  </form>
</section>
