<section class="edit-store-seller">
  <h2 class="edit-store-seller__title">Editar datos de la tienda</h2>

  <form class="edit-store-seller__form">
    <!-- Nombre de la tienda -->
    <div class="edit-store-seller__field">
      <label class="edit-store-seller__label">Nombre de la tienda</label>
      <input type="text" class="edit-store-seller__input" placeholder="Ej: Tienda Verde" required>
    </div>

    <!-- Correo -->
    <div class="edit-store-seller__field">
      <label class="edit-store-seller__label">Correo electrónico</label>
      <input type="email" class="edit-store-seller__input" placeholder="correo@tienda.com" required>
    </div>

    <!-- Teléfono -->
    <div class="edit-store-seller__field">
      <label class="edit-store-seller__label">Teléfono</label>
      <input type="tel" class="edit-store-seller__input" placeholder="+57 300 000 0000" required>
    </div>

    <!-- Dirección -->
    <div class="edit-store-seller__field">
      <label class="edit-store-seller__label">Dirección</label>
      <input type="text" class="edit-store-seller__input" placeholder="Calle 123 #45-67" required>
    </div>

    <!-- Descripción -->
    <div class="edit-store-seller__field edit-store-seller__field--full">
      <label class="edit-store-seller__label">Descripción</label>
      <textarea class="edit-store-seller__textarea" placeholder="Describe tu tienda" required></textarea>
    </div>

    <!-- Logo -->
    <div class="edit-store-seller__field edit-store-seller__field--full">
      <label class="edit-store-seller__label">Logo</label>
      <input type="file" class="edit-store-seller__input edit-store-seller__input--file" accept="image/*">
    </div>

    <!-- Botones -->
    <div class="edit-store-seller__secondary">
      <a href="seller_view.html" class="btn btn-variant2--secondary">Cancelar</a>
    </div>

    <div class="edit-store-seller__primary">
      <a href="profile_store_seller.html" class="btn btn--primary">Guardar cambios</a>
    </div>
  </form>
</section>
