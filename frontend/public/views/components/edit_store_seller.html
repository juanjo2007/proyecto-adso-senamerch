<section class="edit-store-seller-one">
  <div class="edit-store-seller-one__wrapper">

    <!-- HEADER -->
    <header class="edit-store-seller-one__header">
      <h1 class="edit-store-seller-one__title">Editar datos de la tienda</h1>
      <p class="edit-store-seller-one__subtitle">
        Este formulario es para editar<br> tu tienda en <strong>SENA MERCH</strong>.
        Aquí puedes actualizar tus datos cuando lo necesites.
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="edit-store-seller-one__form">

      <!-- Nombre de la tienda -->
      <div class="edit-store-seller-one__group">
        <label class="edit-store-seller-one__label">Nombre de la tienda</label>
        <input type="text" class="edit-store-seller-one__input" placeholder="Ejemplo: Frutas La Esperanza" required>
      </div>

      <!-- Correo -->
      <div class="edit-store-seller-one__group">
        <label class="edit-store-seller-one__label">Correo electrónico</label>
        <input type="email" class="edit-store-seller-one__input" placeholder="correo@tienda.com" required>
      </div>

      <!-- Teléfono -->
      <div class="edit-store-seller-one__group">
        <label class="edit-store-seller-one__label">Teléfono</label>
        <input type="tel" class="edit-store-seller-one__input" placeholder="+57 300 000 0000" required>
      </div>

      <!-- Categoría -->
      <div class="edit-store-seller-one__group">
        <label class="edit-store-seller-one__label">Categoría</label>
        <select class="edit-store-seller-one__input" required>
          <option value="">Selecciona una categoría</option>
          <option value="Frutas">Frutas</option>
          <option value="Verduras">Verduras</option>
          <option value="Lácteos">Lácteos</option>
          <option value="Granos">Granos</option>
          <option value="Todas">Todas</option>
        </select>
      </div>

      <!-- Sección secundaria -->
      <div class="edit-store-seller-one__secondary">
        <button
          type="button"
          class="btn-secundary btn-secundary-style edit-store-seller-one__cancel"
          aria-label="Cancelar"
        >
          Cancelar
          <img
            src="/frontend/public/assets/icons/cancel.svg"
            alt=""
            class="btn-secundary__icon"
            aria-hidden="true"
          />
        </button>
      </div>

      <!-- Botones -->
      <div class="edit-store-seller-one__buttons">
        <button class="btn btn--primary edit-store-seller-one__continue">
          Siguiente
          <img src="/frontend/public/assets/icons/continue.svg" alt="Icono" class="btn__icon">
        </button>
      </div>

    </form>
  </div>
</section>
