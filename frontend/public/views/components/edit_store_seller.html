<section class="edit-store-seller">
  <h2 class="edit-store__title">Editar datos de la tienda</h2>

  <form class="edit-store__form">
    <!-- Nombre de la tienda -->
    <div class="edit-store__field">
      <label for="store-name" class="edit-store__label">Nombre de la tienda</label>
      <input type="text" class="edit-store__input" placeholder="Ej: Tienda Verde" required>
    </div>

    <!-- Correo -->
    <div class="edit-store__field">
      <label for="store-email" class="edit-store__label">Correo electrónico</label>
      <input type="email" class="edit-store__input" placeholder="correo@tienda.com" required>
    </div>

    <!-- Teléfono -->
    <div class="edit-store__field">
      <label for="store-phone" class="edit-store__label">Teléfono</label>
      <input type="tel" class="edit-store__input" placeholder="+57 300 000 0000" required>
    </div>

    <!-- Dirección -->
    <div class="edit-store__field">
      <label for="store-address" class="edit-store__label">Dirección</label>
      <input id="store-address" type="text" class="edit-store__input" placeholder="Calle 123 #45-67" required>
    </div>

    <!-- Descripción -->
    <div class="edit-store__field">
      <label for="store-desc" class="edit-store__label">Descripción</label>
      <textarea id="store-desc" class="edit-store__textarea" placeholder="Describe tu tienda" required></textarea>
    </div>

    <!-- Logo -->
    <div class="edit-store__field">
      <label for="store-logo" class="edit-store__label">Logo</label>
      <input type="file" class="edit-store__input edit-store__input--file" accept="image/*">
    </div>

    <!-- Botones -->
    <div class="edit-store__actions">
      <a href="/frontend/public/views/profile_store_seller.html" class="btn btn--primary">Guardar cambios</a>
      <a href="/frontend/public/views/profile_store_seller.html" class="btn btn--secondary">Cancelar</a>
    </div>
  </form>
</section>
