<article class="card-home">
  <img class="card-home__image" src="{{image}}" alt="Imagen de {{name}}">
  <div class="card-home__info">
    <h2 class="card-home__title">{{name}}</h2>
    <p class="card-home__price">${{price}}</p>
    <a href="login.html" class="btn btn--primary">Comprar</a>
  </div>
</article>
