<article class="card-home">
  <img class="card-home__image" src="{{image}}" alt="Imagen de {{name}}">
  <div class="card-home__info">
    <h2 class="card-home__title">{{name}}</h2>
    <p class="card-home__price">${{price}}</p>
    <button type="button" class="btn btn--primary card-home__pay">
      Comprar
      <img src="/frontend/public/assets/icons/cash-button.svg" alt="Icono Comprar" class="btn__icon card-home__icon" />
    </button>
  </div>
</article>
