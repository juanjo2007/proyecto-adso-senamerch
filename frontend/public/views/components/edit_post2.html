<section class="edit-post-two">
  <div class="edit-post-two__wrapper">

    <!-- HEADER -->
    <header class="edit-post-two__header">
      <h1 class="edit-post-two__title">Sigue Editando el producto</h1>
      <p class="edit-post-two__subtitle">
        Completa o modifica la información de tu producto en <strong>SENA MERCH</strong>.
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="edit-post-two__form">

      <!-- Grupo: Precio * Unidad -->
      <div class="edit-post-two__group">
        <label class="edit-post-two__label">Precio * Unidad de medida</label>
        <select class="edit-post-two__input" required>
          <option value="" disabled>Selecciona una unidad</option>
          <option value="kg" selected>Kilogramos (kg)</option>
          <option value="lb">Libra (lb)</option>
          <option value="unidad">Unidad</option>
          <option value="litro">Litro (L)</option>
          <option value="mililitro">Mililitro (mL)</option>
        </select>
      </div>

      <!-- Grupo: Unidad de medida -->
      <div class="edit-post-two__group">
        <label class="edit-post-two__label">Unidad de medida</label>
        <select class="edit-post-two__input" required>
          <option value="" disabled>Selecciona una unidad</option>
          <option value="kg" selected>Kilogramos (kg)</option>
          <option value="lb">Libras (lb)</option>
          <option value="unidad">Unidad</option>
          <option value="litro">Litros (L)</option>
          <option value="mililitro">Mililitros (mL)</option>
        </select>
      </div>

      <!-- Grupo: Descuento -->
      <div class="edit-post-two__group">
        <label class="edit-post-two__label">Descuento (%)</label>
        <input 
          type="number"
          class="edit-post-two__input"
          value="10"
          min="0"
          max="100"
        >
      </div>

      <!-- Grupo: Imagen -->
      <div class="edit-post-two__group">
        <label class="edit-post-two__label">Imagen del producto</label>
        <input 
          type="file"
          class="edit-post-two__input"
          accept="image/*"
        >
      </div>

      <!-- Grupo: Descripción -->
      <div class="edit-post-two__group edit-post-two__group--full">
        <label class="edit-post-two__label">Descripción</label>
        <textarea class="edit-post-two__textarea">Tomates frescos del Valle, cultivados sin pesticidas.</textarea>
      </div>

      <!-- Grupo Botón cancelar -->
      <div class="edit-post-two__group ">
        <div class="edit-post-two__secondary">
          <button class="btn-secundary btn-secundary-style edit-post-two__cancel">
            Cancelar producto
            <img src="/frontend/public/assets/icons/cancel.svg" alt="Icono cancelar" class="btn-secundary__icon">
          </button>
        </div>
      </div>

      <!-- Grupo Botón guardar -->
      <div class="edit-post-two__group ">
        <div class="edit-post-two__buttons">
          <button type="button" class="btn btn--primary edit-post-two__save">
            Guardar cambios
            <img src="/frontend/public/assets/icons/save.svg" alt="Icono guardar" class="btn__icon"/>
          </button>
        </div>
      </div>

    </form>
  </div>
</section>
