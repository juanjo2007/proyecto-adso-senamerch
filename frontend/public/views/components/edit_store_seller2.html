<section class="edit-store-seller">
  <div class="edit-store-seller__wrapper">

    <h2 class="edit-store-seller__title">Editar datos de la tienda</h2>

    <form class="edit-store-seller__form">

      <div class="edit-store-seller__group">
        <label class="edit-store-seller__label">Dirección de la tienda</label>
        <a href="add_adress.html" class="edit-store-seller__link">Editar dirección</a>
      </div>

      <div class="edit-store-seller__group">
        <label class="edit-store-seller__label">Información propietario</label>
        <a href="view_store_admin_form.html" class="edit-store-seller__link">
          Agregar La información del propietario
        </a>
      </div>

      <!-- Descripción -->
      <div class="edit-store-seller__group edit-store-seller__group--full">
        <label class="edit-store-seller__label">Descripción</label>
        <textarea
          class="edit-store-seller__textarea"
          rows="4"
          placeholder="Escribe una breve descripción de tu tienda..."
          required
        ></textarea>
      </div>


      <div class="edit-store-seller__group">
        <label class="edit-store-seller__label">Imagen de portada</label>
        <input type="file" class="edit-store-seller__input" accept="image/*">
      </div>

      <!-- Botón secundario -->
      <div class="edit-store-seller__secondary">
        <button
          type="button"
          class="btn-secundary btn-secundary-style edit-store-seller__cancel"
          aria-label="Cancelar edición"
        >
          Cancelar
          <img
            src="/frontend/public/assets/icons/cancel.svg"
            alt=""
            class="btn-secundary__icon"
            aria-hidden="true"
          />
        </button>
      </div>

      <!-- Botón primario -->
      <div class="edit-store-seller__primary">
        <button
          type="submit"
          class="btn btn--primary edit-store-seller__save"
          aria-label="Guardar datos de la tienda"
        >
          Guardar cambios
          <img
            src="/frontend/public/assets/icons/save.svg"
            alt=""
            class="btn__icon edit-store-seller__icon"
            aria-hidden="true"
          />
        </button>
      </div>

    </form>
  </div>
</section>
