<section class="create-post">
  <div class="create-post__wrapper">

    <!-- HEADER -->
    <header class="create-post__header">
      <h1 class="create-post__title">Continua agregando<br> la Información del producto</h1>
      <p class="create-post__subtitle">
        "Añade imágenes del producto para que tus clientes puedan verlo con detalle y confianza."
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="create-post__form">

      <!-- Campo: Descuento -->
      <!-- Campo: Imagen (3 entradas) -->
      <div class="create-post__group ">
        <label class="create-post__label">Primera imagen del producto</label>
        <input type="file" class="create-post__input" accept="image/*">
      </div>
      
      <div class="create-post__group ">
        <label class="create-post__label">Segunda imagen del producto</label>
        <input type="file" class="create-post__input" accept="image/*">
      </div>

      <div class="create-post__group ">
        <label class="create-post__label">Tercera imagen del producto</label>
        <input type="file" class="create-post__input" accept="image/*">
      </div>

      <div class="create-post__group ">
        <label class="create-post__label">Cuarta imagen del producto</label>
        <input type="file" class="create-post__input" accept="image/*">
      </div>
    
      <!-- Botón secundario -->
      <div class="create-post__secondary">
        <button
          type="button"
          class="btn-secundary btn-secundary-style create-post__cancel"
          aria-label="Cancelar edición"
        >
          Volver
          <img
            src="/frontend/public/assets/icons/return.svg"
            alt=""
            class="btn-secundary__icon"
            aria-hidden="true"
          />
        </button>
      </div>

      <!-- Botón principal -->
      <div class="create-post__buttons">
        <button
          type="submit"
          class="btn btn--primary create-post__continue"
          aria-label="Guardar datos del administrador"
        >
          Siguiente
          <img
            src="/frontend/public/assets/icons/continue.svg"
            alt=""
            class="btn__icon"
            aria-hidden="true"
          />
        </button>
      </div>

    </form>
  </div>
</section>
