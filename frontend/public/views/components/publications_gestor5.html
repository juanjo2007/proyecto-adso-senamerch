<section class="create-post-five">
  <div class="create-post-five__wrapper">

    <!-- HEADER -->
    <header class="create-post-five__header">
      <h1 class="create-post-five__title">Continua agregando<br> la Información del producto</h1>
      <p class="create-post-five__subtitle">
        Completa la información necesaria para continuar<br>
        con el registro de tu producto en <strong>SENA MERCH</strong>.
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="create-post-five__form">

      <!-- Campo: Texto -->
      <div class="create-post-five__group create-post-five__group--full">
        <label class="create-post-five__label">Aporte para inventarios</label>
        <textarea 
          class="create-post-five__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>

      <!-- Botones secundarios -->
      <div class="create-post-five__buttons-wrapper">

        <div class="create-post-five__secondary">
          <button type="button" class="btn-secundary btn-secundary-style create-post-five__cancel">
            Cancelar
            <img src="/frontend/public/assets/icons/cancel.svg" class="btn-secundary__icon" alt="">
          </button>
        </div>

        <div class="create-post-five__buttons">
          <button type="submit" class="btn btn--primary create-post-five__continue">
            Siguiente
            <img src="/frontend/public/assets/icons/continue.svg" class="btn__icon" alt="">
          </button>
        </div>

      </div>

    </form>
  </div>
</section>
