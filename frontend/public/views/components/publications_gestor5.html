<section class="create-post">
  <div class="create-post__wrapper">

    <!-- HEADER -->
    <header class="create-post__header">
      <h1 class="create-post__title">Información del producto</h1>
      <p class="create-post__subtitle">
        Este formulario es para registrar tu producto.<br>
        Podrás publicarlo y gestionarlo fácilmente.
      </p>
    </header>
    <!-- FORMULARIO -->
    <form class="create-post__form">
      <!-- Campo: Unidad de medida -->
      <div class="create-post__group ">
        <label class="create-post__label">Aporte para inventarios</label>
        <textarea 
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>
      <!-- Campo: Imagen (2 columnas) -->
      <div class="create-post-one__group">
        <label class="create-post-one__label">Dirección</label>
        <a href="/frontend/public/views/view_publications_gestor6.html" class="create-post-one__link">Agrega las caracterizticas del producto</a>
        <small class="create-post-one__text">Todo estará más cerca de ti.</small>
      </div>

      <!-- Botón secundario -->
      <div class="create-post__secondary">
        <button
          type="button"
          class="btn-secundary btn-secundary-style create-post__cancel"
          aria-label="Cancelar edición"
        >
          Cancelar
          <img
            src="/frontend/public/assets/icons/cancel.svg"
            alt=""
            class="btn-secundary__icon"
            aria-hidden="true"
          />
        </button>
      </div>

      <!-- Botón principal -->
      <div class="create-post__buttons">
        <button
          type="submit"
          class="btn btn--primary create-post__continue"
          aria-label="Guardar datos del administrador"
        >
          Siguiente
          <img
            src="/frontend/public/assets/icons/continue.svg"
            alt=""
            class="btn__icon"
            aria-hidden="true"
          />
        </button>
      </div>

    </form>
  </div>
</section>
