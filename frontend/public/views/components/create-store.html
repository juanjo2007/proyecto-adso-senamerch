<section class="create-store">
  <div class="create-store__wrapper">
    <!-- 🔹 Encabezado -->
    <header class="store-header">
      <h1 class="store-title">Crear Tienda</h1>
      <p class="store-subtitle">
        Completa el formulario para registrar tu tienda en <strong>SENA MERCH</strong>.
        Con tu perfil podrás publicar productos y gestionar tus ventas fácilmente.
      </p>
    </header>

    <!-- 🔹 Formulario -->
    <form class="store-form">
      <!-- Nombre de la tienda -->
      <div class="form-group">
        <label class="form-label">Nombre de la tienda</label>
        <input type="text" name="store-name" class="form-input" placeholder="Ejemplo: Frutas La Esperanza" required>
      </div>

      <!-- Descripción -->
      <div class="form-group">
        <label class="form-label">Descripción</label>
        <textarea name="store-description" class="form-input" rows="4" placeholder="Escribe una breve descripción de tu tienda..." required></textarea>
      </div>

      <!-- Categoría -->
      <div class="form-group">
        <label class="form-label">Categoría</label>
        <select name="store-category" class="form-input" required>
          <option value="">Selecciona una categoría</option>
          <option value="Frutas">Frutas</option>
          <option value="Verdeuras">Verdeuras</option>
          <option value="Lácteos">Lácteos</option>
          <option value="Todas">Todas</option>
        </select>
      </div>

      <!-- Imagen de portada -->
      <div class="form-group">
        <label class="form-label">Imagen de portada</label>
        <input type="file" name="store-image" class="form-input" accept="image/*">
        <small class="form-helper">Formatos aceptados: JPG, PNG. Tamaño máximo: 2MB.</small>
      </div>

      <!-- Botones -->
      <div class="form-buttons">
        <a href="profile_store_seller.html" class="btn btn--primary">Crear Tienda</a>
        <a href="seller_view.html" class="btn--variant2 btn--variant2--secondary shopping-cart__continue">Cancelar</a>
      </div>
    </form>
  </div>
</section>
