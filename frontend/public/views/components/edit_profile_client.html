<section class="edit-profile-user">
  <div class="edit-profile-user__wrapper">

    <!-- Header -->
    <header class="edit-profile-user__header">
      <h1 class="edit-profile-user__title">Editar perfil</h1>
      <p class="edit-profile-user__subtitle">
        Actualiza tu información personal y mantén tu cuenta al día.
      </p>
    </header>

    <!-- Form -->
    <form class="edit-profile-user__form">

      <!-- Foto de perfil -->
      <div class="edit-profile-user__group ">
        <label class="edit-profile-user__label">Imagen de portada</label>
        <input type="file" class="edit-profile-user__input" accept="image/*">
      </div>

      <!-- Dirección -->
      <div class="edit-profile-user__group">
        <label class="edit-profile-user__label">Dirección</label>
        <a href="/frontend/public/views/add_adress.html" class="edit-profile-user__link">
          Agregar dirección
        </a>
        <span class="edit-profile-user__label">Si tuviste un error puedes corregir tu dirección</span>
      </div>

      <!-- Correo -->
      <div class="edit-profile-user__group">
        <label class="edit-profile-user__label">Correo electrónico</label>
        <input type="email" class="edit-profile-user__input" value="juanperez@empresa.com">
      </div>

      <!-- Nombre -->
      <div class="edit-profile-user__group">
        <label class="edit-profile-user__label">Nombre</label>
        <input type="text" class="edit-profile-user__input" value="Juan Pérez">
      </div>

      <!-- Botón secundario -->
      <div class="edit-profile-user__secondary">
        <button
          type="button"
          class="btn-secundary btn-secundary-style edit-profile-user__cancel"
          aria-label="Cancelar edición"
        >
          Cancelar
          <img
            src="/frontend/public/assets/icons/cancel.svg"
            alt=""
            class="btn-secundary__icon"
            aria-hidden="true"
          />
        </button>
      </div>

      <!-- Botón principal -->
      <div class="edit-profile-user__buttons">
        <button
          type="submit"
          class="btn btn--primary edit-profile-user__submit"
          aria-label="Guardar datos del administrador"
        >
          Siguiente 
          <img
            src="/frontend/public/assets/icons/continue.svg"
            alt=""
            class="btn__icon edit-profile-user__icon"
          />
        </button>
      </div>

    </form>
  </div>
</section>
