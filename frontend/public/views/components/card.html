<main class="products">
  <div class="card-container">
    <div class="product">
      <img class="product__image" src="{{image}}">
      <div class="product__information">
        <p class="product__name">{{name}}</p>
        <p class="product__price">${{price}}</p>
        <!-- Botón reutilizable -->
        <button class="btn btn--primary"> Comprar </button>
      </div>
    </div>
  </div>
</main>
