<article class="card">
  <img class="card__image" src="{{image}}" alt="Imagen de {{name}}">
  <div class="card__info">
    <h2 class="card__title">{{name}}</h2>
    <p class="card__price">${{price}}</p>
    <button type="button" class="btn btn--primary card__pay">
      Comprar
      <img src="/frontend/public/assets/icons/cash-button.svg" alt="Icono Comprar" class="btn__icon card__icon" />
    </button>
  </div>
</article>
