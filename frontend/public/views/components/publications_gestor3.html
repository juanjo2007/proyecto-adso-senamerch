<section class="create-post">
  <div class="create-post__wrapper">

    <!-- HEADER -->
    <header class="create-post__header">
      <h1 class="create-post__title">Continúa con la información del producto</h1>
      <p class="create-post__subtitle">
        Completa esta información adicional para que los compradores conozcan mejor tu producto.
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="create-post__form">

      <!-- Campo: Lo que tendrías que saber -->
      <div class="create-post__group">
        <label class="create-post__label">Lo que tendrías que saber</label>
        <textarea 
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>

      <!-- Campo: Información esencial -->
      <div class="create-post__group">
        <label class="create-post__label">Información esencial</label>
        <textarea 
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>

      <!-- Campo: Contenido nutritivo -->
      <div class="create-post__group">
        <label class="create-post__label">Contenido nutritivo</label>
        <textarea 
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>

      <!-- Campo: Variedades comunes -->
      <div class="create-post__group">
        <label class="create-post__label">Variedades comunes</label>
        <textarea 
          class="create-post__textarea"
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>

      <!-- Botón secundario -->
      <div class="create-post__secondary">
        <button
          type="button"
          class="btn-secundary btn-secundary-style create-post__cancel"
          aria-label="Cancelar edición"
        >
          Volver
          <img
            src="/frontend/public/assets/icons/return.svg"
            alt=""
            class="btn-secundary__icon"
            aria-hidden="true"
          />
        </button>
      </div>

      <!-- Botón principal -->
      <div class="create-post__buttons">
        <button
          type="submit"
          class="btn btn--primary create-post__continue"
          aria-label="Guardar datos del administrador"
        >
          Siguiente
          <img
            src="/frontend/public/assets/icons/continue.svg"
            alt=""
            class="btn__icon"
            aria-hidden="true"
          />
        </button>
      </div>

    </form>
  </div>
</section>
