<section class="create-post">
  <div class="create-post__wrapper">

    <!-- HEADER -->
    <header class="create-post__header">
      <h1 class="create-post__title">Continúa con la información del producto</h1>
      <p class="create-post__subtitle">
        Completa esta información adicional para que los compradores conozcan mejor tu producto.
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="create-post__form">

      <div class="create-post__group">
        <label class="create-post__label">Unidad de medida</label>
        <select class="create-post__input" required>
          <option value="" selected disabled>Selecciona una unidad</option>
          <option value="kg">Solido</option>
          <option value="lb">Liquido</option>
        </select>
      </div>

      <div class="create-post__group">
        <label class="create-post__label">Descuento (%)</label>
        <input 
          type="number"
          class="create-post__input"
          placeholder="Ej: 10"
          min="0"
          max="100"
        >
      </div>

      <!-- NUEVO: Fecha de caducidad -->
      <div class="create-post__group">
        <label class="create-post__label">Fecha de caducidad</label>
        <input 
          type="date"
          class="create-post__input"
          required
        >
      </div>

      <!-- NUEVO: Pago en efectivo -->
      <div class="create-post__group">
        <label class="create-post__label">¿Acepta pago en efectivo?</label>
        <select class="create-post__input" required>
          <option value="" selected disabled>Selecciona una opción</option>
          <option value="si">Efectivo</option>
        </select>
      </div>
      <!-- Botón secundario -->
      <div class="create-post__secondary">
        <button
          type="button"
          class="btn-secundary btn-secundary-style create-post__cancel"
          aria-label="Cancelar edición"
        >
          Volver
          <img
            src="/frontend/public/assets/icons/return.svg"
            alt=""
            class="btn-secundary__icon"
            aria-hidden="true"
          />
        </button>
      </div>

      <!-- Botón principal -->
      <div class="create-post__buttons">
        <button
          type="submit"
          class="btn btn--primary create-post__continue"
          aria-label="Guardar datos del administrador"
        >
          Siguiente
          <img
            src="/frontend/public/assets/icons/continue.svg"
            alt=""
            class="btn__icon"
            aria-hidden="true"
          />
        </button>
      </div>

    </form>
  </div>
</section>
