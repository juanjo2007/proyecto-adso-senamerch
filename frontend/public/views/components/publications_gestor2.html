<section class="create-post">
  <div class="create-post__wrapper">

    <!-- HEADER -->
    <header class="create-post__header">
      <h1 class="create-post__title">Termina de crear el producto</h1>
      <p class="create-post__subtitle">
        Este formulario es para registrar<br> tu producto en <strong>SENA MERCH</strong>.
        Podrás publicarlo y gestionarlo fácilmente.
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="create-post__form">

      <!-- Campo: Descuento -->
      <div class="create-post__group">
        <label class="create-post__label">Descuento (%)</label>
        <input 
          type="number"
          class="create-post__input"
          placeholder="Ej: 10"
          min="0"
          max="100"
        >
      </div>

      <!-- Campo: Imagen (3 entradas) -->
      <div class="create-post__group ">
        <label class="create-post__label">Imagen del producto</label>
        <input type="file" class="create-post__input" accept="image/*">
      </div>

      <div class="create-post__group ">
        <label class="create-post__label">Imagen del producto</label>
        <input type="file" class="create-post__input" accept="image/*">
      </div>

      <div class="create-post__group ">
        <label class="create-post__label">Imagen del producto</label>
        <input type="file" class="create-post__input" accept="image/*">
      </div>

      <!-- Botón secundario -->
      <div class="create-post__secondary">
        <button
          type="button"
          class="btn-secundary btn-secundary-style create-post__cancel"
          aria-label="Cancelar edición"
        >
          Cancelar
          <img src="/frontend/public/assets/icons/cancel.svg" alt="" class="btn-secundary__icon" aria-hidden="true"/>
        </button>
      </div>

      <!-- Botón principal -->
      <div class="create-post__buttons">
        <button
          type="submit"
          class="btn btn--primary create-post__continue"
          aria-label="Guardar datos del administrador"
        >
          Crear producto
          <img src="/frontend/public/assets/icons/continue.svg" alt="" class="btn__icon" aria-hidden="true"/>
        </button>
      </div>

    </form>

  </div>
</section>
