<section class="create-post">
  <form class="create-post__form">
    <div class="create-post__fields-wrapper">
      <h2 class="create-post__title">Sigue creando el producto</h2>

      <!-- Campo: Unidad de medida -->
      <div class="create-post__field">
        <label class="create-post__label">Unidad de medida</label>
        <select class="create-post__select" required>
          <option value="" selected disabled>Selecciona una unidad</option>
          <option value="kg">Kilogramos (kg)</option>
          <option value="lb">Libras (lb)</option>
          <option value="unidad">Unidad</option>
          <option value="litro">Litros (L)</option>
          <option value="mililitro">Mililitros (mL)</option>
          <option value="todas">Todas las opciones (*)</option>
        </select>
      </div>

      <!-- Campo: Descuento -->
      <div class="create-post__field">
        <label class="create-post__label">Descuento (%)</label>
        <input 
          type="number" 
          class="create-post__input" 
          placeholder="Ej: 10" 
          min="0" 
          max="100"
        >
      </div>

      <!-- Campo: Descripción -->
      <div class="create-post__field create-post__field--full">
        <label class="create-post__label">Descripción</label>
        <textarea 
          class="create-post__textarea" 
          placeholder="Describe brevemente el producto..."
        ></textarea>
      </div>

      <!-- Campo: Imagen -->
      <div class="create-post__field create-post__field--full">
        <label class="create-post__label">Imagen del producto</label>
        <input 
          type="file" 
          class="create-post__input" 
          accept="image/*"
        >
      </div>
    </div>

    <div class="create-post__field-secundary">
      <button
        type="button"
        class="btn-secundary btn-secundary-style create-post__cancel"
        aria-label="Cancelar edición"
      >
        Cancelar
        <img
          src="/frontend/public/assets/icons/cancel.svg"
          alt=""
          class="btn-secundary__icon"
          aria-hidden="true"
        />
      </button>
    </div>

    <div class="create-post__field-actions">
      <button
        type="submit"
        class="btn btn--primary create-post__continue"
        aria-label="Guardar datos del administrador"
      >
        Crear producto
        <img
          src="/frontend/public/assets/icons/continue.svg"
          alt=""
          class="btn__icon"
          aria-hidden="true"
        />
      </button>
    </div>
  </form>
</section>
