<section class="contact">
  <div class="contact__overlay">
    <div class="contact__container">
      <!-- Encabezado -->
      <header class="contact__header">
        <h2 class="contact__title">Contáctanos</h2>
        <p class="contact__subtitle">
          En <strong>SENA MERCH</strong> queremos escucharte.  
          Si tienes preguntas, sugerencias o deseas más información, escríbenos y te responderemos lo más pronto posible.
        </p>
      </header>

      <!-- Formulario -->
      <form class="contact__form">
        <div class="contact__group">
          <label>Nombre</label>
          <input type="text" name="name" placeholder="Tu nombre completo" required>
        </div>

        <div class="contact__group">
          <label>Correo electrónico</label>
          <input type="email" name="email" placeholder="tunombre@correo.com" required>
        </div>

        <div class="contact__group">
          <label>Mensaje</label>
          <textarea name="message" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <div class="contact__actions-primary">
          <button class="btn btn--primary contact__send">
            Enviar mensaje
            <img src="/frontend/public/assets/icons/contact.svg" alt="Icono suspender usuario" class="btn__icon contact__icon">
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
