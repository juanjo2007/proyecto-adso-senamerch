<main class="sales-doc">

  <!-- 📌 Título -->
  <h1 class="sales-doc__title">Documentos de Venta</h1>

  <!-- 📦 Tabla -->
  <div class="sales-doc__table-wrapper">
    <table class="sales-doc__table">
      <thead class="sales-doc__head">
        <tr class="sales-doc__row sales-doc__row--header">
          <th class="sales-doc__cell">#Documento</th>
          <th class="sales-doc__cell">#Usuario</th>
          <th class="sales-doc__cell">#Tienda</th>
          <th class="sales-doc__cell">Acción</th>
        </tr>
      </thead>

      <tbody class="sales-doc__body">
        <tr class="sales-doc__row">
          <td class="sales-doc__cell">#1</td>
          <td class="sales-doc__cell">#1</td>
          <td class="sales-doc__cell">#1</td>
          <td class="sales-doc__cell">
            <button class="sales-doc__btn">Deshabilitar</button>
          </td>
        </tr>

        <tr class="sales-doc__row sales-doc__row--muted">
          <td class="sales-doc__cell">#2</td>
          <td class="sales-doc__cell">#2</td>
          <td class="sales-doc__cell">#2</td>
          <td class="sales-doc__cell">
            <a href="profile_client.html" class="sales-doc__btn sales-doc__btn--link">Ver detalle</a>
          </td>
        </tr>

        <tr class="sales-doc__row">
          <td class="sales-doc__cell">#3</td>
          <td class="sales-doc__cell">#3</td>
          <td class="sales-doc__cell">#3</td>
          <td class="sales-doc__cell">
            <a href="profile_client.html" class="sales-doc__btn sales-doc__btn--link">Ver detalle</a>
          </td>
        </tr>

        <tr class="sales-doc__row sales-doc__row--muted">
          <td class="sales-doc__cell">#4</td>
          <td class="sales-doc__cell">#4</td>
          <td class="sales-doc__cell">#4</td>
          <td class="sales-doc__cell">
            <button class="sales-doc__btn">Deshabilitar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 🔗 Pie del componente -->
  <div class="sales-doc__footer">
    <a href="payment_gateway.html" class="sales-doc__btn sales-doc__btn--primary">Ir a Pasarela de Pago</a>
  </div>

</main>
