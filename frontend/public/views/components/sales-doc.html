<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documento de venta</title>
<link rel="stylesheet" href="/frontend/public/css/reset.css">
<link rel="stylesheet" href="/frontend/public/css/variables.css">
<link rel="stylesheet" href="/frontend/public/css/components/sales-doc.css">
<link rel="stylesheet" href="/frontend/public/css/main.css">
</head>
<body>
<main class="sales-doc">
    <h1 class="sales-doc__title">Documento de venta</h1>

    <!-- 🔍 Barra de búsqueda -->
    <div class="sales-doc__search">
        <input 
        type="text" 
        class="sales-doc__search-input" 
        placeholder="Buscar Documento"
        >
        <span class="sales-doc__search-icon">🔍</span>
    </div>
    <p class="sales-doc__search-text">Encontrarás con facilidad lo que buscas.</p>

    <!-- 📄 Tabla -->
    <div class="sales-doc__table-wrapper">
        <div class="sales-doc__table">
        <!-- Encabezado -->
        <div class="sales-doc__row sales-doc__row--header">
            <span class="sales-doc__cell">#Documento de venta</span>
            <span class="sales-doc__cell">#Usuario</span>
            <span class="sales-doc__cell">#Tienda</span>
            <span class="sales-doc__cell">Acción</span>
        </div>

        <!-- ✅ Filas -->
        <div class="sales-doc__row">
            <span class="sales-doc__cell">#1</span>
            <span class="sales-doc__cell">#1</span>
            <span class="sales-doc__cell">#1</span>
            <button class="sales-doc__btn">Deshabilitar</button>
        </div>
        <div class="sales-doc__row">
            <span class="sales-doc__cell sales-doc__cell--muted">#2</span>
            <span class="sales-doc__cell sales-doc__cell--muted">#2</span>
            <span class="sales-doc__cell sales-doc__cell--muted">#2</span>
            <button class="sales-doc__btn">Deshabilitar</button>
        </div>
        <div class="sales-doc__row">
            <span class="sales-doc__cell">#3</span>
            <span class="sales-doc__cell">#3</span>
            <span class="sales-doc__cell">#3</span>
            <button class="sales-doc__btn">Deshabilitar</button>
        </div>
        <div class="sales-doc__row">
            <span class="sales-doc__cell sales-doc__cell--muted">#4</span>
            <span class="sales-doc__cell sales-doc__cell--muted">#4</span>
            <span class="sales-doc__cell sales-doc__cell--muted">#4</span>
            <button class="sales-doc__btn">Deshabilitar</button>
        </div>
        <div class="sales-doc__row">
            <span class="sales-doc__cell">#5</span>
            <span class="sales-doc__cell">#5</span>
            <span class="sales-doc__cell">#5</span>
            <button class="sales-doc__btn">Deshabilitar</button>
        </div>
        <div class="sales-doc__row">
            <span class="sales-doc__cell sales-doc__cell--muted">#6</span>
            <span class="sales-doc__cell sales-doc__cell--muted">#6</span>
            <span class="sales-doc__cell sales-doc__cell--muted">#6</span>
            <button class="sales-doc__btn">Deshabilitar</button>
        </div>
        <div class="sales-doc__row">
            <span class="sales-doc__cell">#7</span>
            <span class="sales-doc__cell">#7</span>
            <span class="sales-doc__cell">#7</span>
            <button class="sales-doc__btn">Deshabilitar</button>
        </div>
        <div class="sales-doc__row">
            <span class="sales-doc__cell sales-doc__cell--muted">#8</span>
            <span class="sales-doc__cell sales-doc__cell--muted">#8</span>
            <span class="sales-doc__cell sales-doc__cell--muted">#8</span>
            <button class="sales-doc__btn">Deshabilitar</button>
        </div>
    </div>
    </div>
</main>

    <script src="/frontend/public/js/components/sales-doc.js"></script>
</body>
</html>
