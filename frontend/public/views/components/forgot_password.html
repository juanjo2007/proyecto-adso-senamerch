<section class="forgot">
  <div class="forgot__container">
    <h1 class="forgot__title">¿Olvidaste tu contraseña?</h1>

    <p class="forgot__text">
      No te preocupes, ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.
    </p>

    <form class="forgot__form" action="code_verify.html">
      <div class="forgot__field">
        <label class="forgot__label">Correo electrónico</label>
        <input 
          type="email" 
          class="forgot__input" 
          placeholder="Ingresa tu correo" 
          required
        >
      </div>

      <div class="forgot__actions">
        <button type="submit" class="btn btn--primary forgot__submit">
          Enviar código
          <img src="/frontend/public/assets/icons/continue.svg" alt="Icono Enviar" class="btn__icon">
        </button>
      </div>
    </form>

    <a href="login.html" class="forgot__link">Volver al inicio de sesión</a>
  </div>
</section>
